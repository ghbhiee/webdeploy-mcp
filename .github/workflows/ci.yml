name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/webdeploy_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/webdeploy_test
      PUBLIC_URL: http://localhost:3847
      MCP_PUBLIC_URL: http://localhost:3847
      TEST_BASE_URL: http://localhost:3847
      DATA_DIR: /tmp/webdeploy-data
      CONFIG_DIR: /tmp/webdeploy-config
      MASTER_KEY_FILE: /tmp/webdeploy-config/master.key
      OIDC_JWKS_FILE: /tmp/webdeploy-config/oidc-jwks.json
      TRUST_PROXY: "false"
      NODE_ENV: test
      WEBDEPLOY_ENV_FILE: /tmp/webdeploy.env
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb webdeploy_test
      - name: Prepare test secrets and database
        run: |
          mkdir -p /tmp/webdeploy-config /tmp/webdeploy-data
          openssl rand -base64 32 >/tmp/webdeploy-config/master.key
          node installer/generate-jwks.mjs /tmp/webdeploy-config/oidc-jwks.json
          node packages/core/dist/migrate.js
          printf '%s\n' \
            "NODE_ENV=test" "HOST=127.0.0.1" "PORT=3847" \
            "PUBLIC_URL=http://localhost:3847" "MCP_PUBLIC_URL=http://localhost:3847" \
            "DATABASE_URL=$DATABASE_URL" "DATA_DIR=/tmp/webdeploy-data" \
            "CONFIG_DIR=/tmp/webdeploy-config" \
            "MASTER_KEY_FILE=/tmp/webdeploy-config/master.key" \
            "OIDC_JWKS_FILE=/tmp/webdeploy-config/oidc-jwks.json" \
            "TRUST_PROXY=false" >/tmp/webdeploy.env
      - run: pnpm test
      - name: Start control plane
        run: |
          node apps/control-plane/dist/index.js >/tmp/webdeploy-control.log 2>&1 &
          echo $! >/tmp/webdeploy-control.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3847/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/webdeploy-control.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: cat /tmp/webdeploy-control.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: |
          find . -type f -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 -n1 bash -n
          shellcheck install.sh installer/*.sh installer/bin/*
